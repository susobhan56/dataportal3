# Build and deploy Node.js app to Azure Web App - dataportal
# Recommended: create the secret AZURE_WEBAPP_PUBLISH_PROFILE (use the publish profile from the Azure Portal)
# Adjust `package` path below if you only want to deploy a build folder (e.g. ./dist or ./build)

name: Build and deploy Next.js standalone app to Azure Web App - dataportal

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js)
        run: npm run build

      - name: Package standalone build artifacts
        run: |
          # Package the Next standalone output and static assets into a zip for deployment.
          # If any of these paths don't exist, zip will skip them; `|| true` prevents job failure.
          zip -r release.zip .next/standalone .next/static package.json public next.config.js || true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./artifact

      - name: List artifact contents (debug)
        run: |
          ls -la
          ls -la artifact
          unzip -l artifact/release.zip || true

      - name: Deploy standalone zip to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dataportal'                                  # change if your App Service name differs
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE1 }}  # ensure this secret exists in repo settings
          package: ./artifact/release.zip
          enable-oryx-build: false
          scm-do-build-during-deploy: false
          startup-command: 'node .next/standalone/server.js'

