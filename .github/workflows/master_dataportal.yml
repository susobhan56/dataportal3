name: Build and deploy Next.js standalone app to Azure Web App - dataportal

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js)
        run: npm run build

      - name: Package standalone build artifacts
        run: |
          # Copy static files into standalone directory
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

          # Zip from inside the standalone folder so server.js is at the root
          cd .next/standalone
          zip -r ../../release.zip .
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure Login
        uses: azure/login@v2 
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Forces the use of the Client Secret instead of OIDC
          auth-type: 'SERVICE_PRINCIPAL'

      - name: Deploy and Configure Azure Web App
        uses: azure/CLI@v1
        with:
          azcliversion: "latest"
          inlineScript: |
            set -euo pipefail
            
            # 1. Deploy the zip
            az webapp deploy --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
              --src-path "release.zip" --type zip

            # 2. Set startup command to the standalone entry point
            az webapp config set --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
              --startup-file "node server.js"
            
            # 3. Set the PORT for Azure Linux App Service
            az webapp config appsettings set --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
              --settings PORT=8080

            # 4. Restart to apply changes
            az webapp restart --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}"
