# Build and deploy Node.js app to Azure Web App - dataportal
# Recommended: create the secret AZURE_WEBAPP_PUBLISH_PROFILE (use the publish profile from the Azure Portal)
# Adjust `package` path below if you only want to deploy a build folder (e.g. ./dist or ./build)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build


      - name: move static files
        run:  mv ./build/static ./build/standalone/build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./build/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dataportal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE1 }}
          package: .  # If you uploaded only build output, point this to that folder (e.g. ./dist)


