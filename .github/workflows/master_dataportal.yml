# Build and deploy Node.js app to Azure Web App - dataportal
# Recommended: create the secret AZURE_WEBAPP_PUBLISH_PROFILE (use the publish profile from the Azure Portal)
# Adjust `package` path below if you only want to deploy a build folder (e.g. ./dist or ./build)

name: Build and deploy Node.js app to Azure Web App - dataportal

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .  # Consider changing to your build output directory (e.g. ./dist)

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dataportal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE1 }}
          package: .  # If you uploaded only build output, point this to that folder (e.g. ./dist)

