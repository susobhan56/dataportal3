name: Build and deploy Next.js standalone app to Azure Web App - dataportal

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Package artifacts
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone && zip -r ../../release.zip .
          
      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure Login (Forced Secret Mode)
        uses: azure/login@v2
        with:
          # This 'creds' parameter forces the action to use your secret 
          # and skip the OIDC check entirely.
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy and Configure
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # No need to set set -euo pipefail, az cli handles it
            az webapp deploy --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" --src-path "release.zip" --type zip

            az webapp config set --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" --startup-file "node server.js"
            
            az webapp config appsettings set --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" --settings PORT=8080
